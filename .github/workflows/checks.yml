# lint·test·문서참조 세 검사. Makefile 타깃을 그대로 부른다 — 로컬과 CI가 갈리면
# "내 머신에서는 통과한다"가 시작된다.
#
# PY·RUFF 를 명령줄에서 덮는다. Makefile 은 .venv/bin/ 을 기본값으로 두는데 CI 에는
# .venv 가 없다. make 는 명령줄 대입이 파일 안 대입보다 우선하므로 타깃 정의를
# 고치지 않고 경로만 바꿔 끼울 수 있다.
name: checks

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 푸시가 오면 진행 중인 실행을 버린다. 검사가 3분 안쪽이라
# 큐를 쌓을 이유가 없다.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 로컬은 pyenv 3.10.13. 패치까지 고정하면 그 패치가 내려갈 때 검사와
          # 무관하게 깨지므로 마이너까지만 맞춘다. pyproject 의 target-version 과 짝이다.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: 의존성 설치
        run: pip install -r requirements-ci.txt

      - name: 주석·docstring 린트
        run: make lint RUFF=ruff

      - name: 테스트
        run: make test PY=python

      # 린터가 잡지 못하는 유일한 자동화 가능 항목. 주석 속 파일명은 산문이라
      # 문서를 개명해도 따라오지 않는다 — 실제로 5곳이 끊긴 채 커밋돼 있었다.
      - name: 문서 참조 해소
        run: make check-docrefs
